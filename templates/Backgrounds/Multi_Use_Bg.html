<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Background Example</title>
    <style>
        /* Basic reset and body setup */
body {
  margin: 0; /* Remove default body margin */
  padding: 0; /* Remove default body padding */
  font-family: sans-serif; /* Example font */
  min-height: 100vh; /* Ensure body takes at least full viewport height */
  overflow-x: hidden; /* Prevent horizontal scrollbars potentially caused by background */
  background-color: #f0f0f0; /* Fallback background for content area if needed */
}

/* The Animated Background */
.animated-background {
  position: fixed; /* Fixes the background relative to the viewport */
  top: 0;
  left: 0;
  width: 100vw; /* Cover the full viewport width */
  height: 100vh; /* Cover the full viewport height */
  z-index: -1; /* Place it behind all other content */
  margin: 0; /* Ensure no margin */
  padding: 0; /* Ensure no padding */

  /* --- Animation Setup --- */
  /* Define the gradient */
  background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
  /* Make the background size larger than the viewport */
  /* This is key for the smooth sliding animation */
  background-size: 400% 400%;
  /* Apply the animation */
  animation: gradientAnimation 15s ease infinite;
}

/* Keyframes for the gradient animation */
@keyframes gradientAnimation {
  0% {
    background-position: 0% 50%; /* Start position */
  }
  50% {
    background-position: 100% 50%; /* Middle position (moves gradient across) */
  }
  100% {
    background-position: 0% 50%; /* Return to start for smooth loop */
  }
}

/* The Main Content Area */
.main-content {
  position: relative; /* Needed to establish stacking context */
  z-index: 1; /* Ensure content is definitely above the background (z-index: 0 or higher works) */
  {% comment %} padding: 8px; /* Add some padding so content isn't stuck to edges */ {% endcomment %}
  color: #333; /* Example text color */
  /* Add more styling for your layout */
  max-width: 100%;
  {% comment %} margin: 1px auto; /* Center content horizontally */ {% endcomment %}
  background-color: rgba(255, 255, 255, 0.0); /* Semi-transparent white background for readability */
  {% comment %} border-radius: 8px; {% endcomment %}
  {% comment %} box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); {% endcomment %}
}

/* Example styling for elements within main-content */
h1 {
  text-align: center;
  color: #1a1a1a;
}

button {
    padding: 10px 20px;
    font-size: 1rem;
    cursor: pointer;
    border: none;
    background-color: #23a6d5;
    color: white;
    border-radius: 5px;
    transition: background-color 0.3s ease;
    
}

button:hover {
    background-color: #1f90b5;
}


nav {

        background-color: #333;
    
        padding: 1rem;
    
    }
    
    
    
    nav ul {
    
    list-style-type: none;
    
        padding: 0;
    
       margin: 0;
    
        display: flex;
    
        justify-content: space-around;
    
    }
    
    
    
    nav a {
    
       color: white;
    
       text-decoration: none;
    
        font-size: 1rem;
    
    }

</style>

</head>
<body>

    <div class="animated-background"></div>

    <div class="main-content">

        <nav>

            <ul>
        
                <li><a href="#">Home</a></li>
        
                <li><a href="#">About</a></li>
        
                <li><a href="#">Services</a></li>
        
                <li><a href="#">Contact</a></li>
        
            </ul>
        
        </nav>

        <h1>Website Content</h1>
        <p>This content sits on top of the animated background.</p>
        <p>Scroll down to see how the background stays fixed.</p>
        <button>Click Me</button>
        <div style="height: !00%; "></div> <p>End of content.</p>
    </div>

</body>
</html>
